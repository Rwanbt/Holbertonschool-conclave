name: CI

on:
  pull_request:
  push:
    branches: [main, dev, erwan]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: "Run backend test suite (no LLM key: real-provider smoke test skips itself)"
        run: python -m pytest backend/tests -q

      - name: "Provider adapter contract tests (simulated, no keys)"
        run: python -m pytest backend/tests/test_providers.py -q

      - name: "Isolation and secret-leakage tests"
        run: python -m pytest backend/tests/test_isolation.py -q

      - name: Run the evaluation suite (scored, no LLM key needed)
        run: python eval/run_eval.py

      - name: "Secret leakage check on the published bundle"
        run: ./scripts/check-no-secrets.sh frontend/dist

  frontend:
    name: Frontend tests, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend test suite
        working-directory: frontend
        run: npm test -- --run
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck + Build
        working-directory: frontend
        run: npm run build

      - name: Verify no secret leaked into the published bundle
        run: ./scripts/check-no-secrets.sh

  deploy:
    name: Deploy artifacts validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate netlify.toml build (frontend, no secrets)
        working-directory: frontend
        run: |
          npm ci
          npm run build
          test -f ../netlify.toml
      - name: Validate backend Docker image builds
        run: docker build -f backend/Dockerfile -t conclave-backend:ci backend